<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flix Lamouri</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0d1422;
  color:white;
}
header{
  background:#17243a;
  padding:25px;
  text-align:center;
  border-bottom:2px solid #2878ff;
}
header h1{color:#48a0ff;margin:0}
.container{padding:20px;max-width:600px;margin:auto}
.card{
  background:#19263b;
  padding:20px;
  margin:15px 0;
  border-radius:14px;
  border:1px solid #30415e;
}
h2{color:#58a5ff}
.company{
  display:inline-block;
  background:#263c5b;
  padding:12px;
  margin:5px;
  border-radius:10px;
}
.notice{
  background:#332b18;
  color:#ffdc86;
  padding:15px;
  border-radius:10px;
  line-height:1.8;
}
footer{text-align:center;color:#9baac0;padding:25px}
</style>
</head>
<body>

<header>
  <h1>Flix Lamouri</h1>
  <p>مرحباً بكم في موقعنا التجريبي</p>
</header>

<div class="container">

  <div class="card">
    <h2>خدمات الهاتف</h2>
    <p>استكشف شركات الهاتف المتوفرة:</p>
    <button class="company" onclick="showCompany('Mobilis')">Mobilis</button>

<button class="company" onclick="showCompany('Ooredoo')">Ooredoo</button>

<button class="company" onclick="showCompany('Djezzy')">Djezzy</button>
  </div>
<div id="result"></div>
  <div class="card">
    <h2>عن الموقع</h2>
    <p>
      Flix Lamouri مشروع تجريبي
      لعرض واجهة خدمات الهاتف.
    </p>
  </div>

  <div class="notice">
    ⚠️ هذه نسخة تجريبية فقط.
    لا توجد عمليات شحن أو تحويل أموال حقيقية.
    ولا يتم استقبال طلبات أو معلومات دفع.
  </div>

</div>

<footer>
  Flix Lamouri © 2026
</footer>
<script>
function showCompany(name) {
  document.getElementById("result").textContent =
    "اخترت شركة " + name + " بنجاح - نسخة تجريبية";
}
</script>
</body>
</html>
